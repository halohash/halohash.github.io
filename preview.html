<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>HaloHash</title>

  <style>
    :root {
      --tile: #4a4f52;
      --text: #eeeeee;
      --bg: #20292e;

      --tile-hover: #565c5f;
      --tile-focus: #646a6d;
      --tile-active: #707679;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;

      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    #app {
      width: 100%;
      height: 100%;

      padding: 5.8vh 4.3vw;

      overflow-y: auto;

      outline: none;

      background: transparent;
    }

    .app-title {
      margin: 0 0 10px;

      font-size: 20px;
      font-weight: 400;
    }

    .row {
      margin-bottom: 28px;
    }

    .row-title {
      margin: 0 0 10px;
      font-family: "Roboto Condensed", Helvetica, Arial, sans-serif;
      font-size: 20px;
      font-weight: 400;
    }

    .tiles {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }


    /* =========================================================
       TV TILE
       ========================================================= */

.tile {
  width: 144px;
  height: 126px;

  border: 0;
  border-radius: 1px;

  background: var(--tile);
  color: var(--text);

  box-shadow: 0 4px 9px rgba(0, 0, 0, .28);

  padding: 0;

  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;

  overflow: hidden;

  cursor: pointer;

  transition:
    background .12s ease,
    transform .12s ease,
    box-shadow .12s ease;
}

    .tile:hover {
      background: var(--tile-hover);
    }

    .tile.selected {
      background: var(--tile-focus);

      transform: scale(1.025);

      box-shadow:
        0 5px 14px rgba(0, 0, 0, .42);
    }

    .tile:active {
      background: var(--tile-active);

      transform: scale(.985);
    }

.image-tile-button {
  width: 226px;
  height: 127px;

  padding: 0;

  display: block;

  overflow: hidden;
}

.image-tile-button .imagetile {
  display: block;

  width: 100%;
  height: 100%;

  aspect-ratio: 16 / 9;

  object-fit: cover;
}

    /* =========================================================
       MATERIAL SYMBOL ICON
       ========================================================= */

    .tile-icon {
      width: 100%;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 7em !important;
      line-height: 1;
      flex-shrink: 0;
    }

    .material-symbols-rounded {
      font-family: "Material Icons";

      font-weight: normal;
      font-style: normal;

      font-size: 52px;
      line-height: 1;

      letter-spacing: normal;
      text-transform: none;

      white-space: nowrap;
      word-wrap: normal;

      direction: ltr;

      -webkit-font-feature-settings: "liga";
      -webkit-font-smoothing: antialiased;

      font-feature-settings: "liga";
    }


    /* =========================================================
       NORMAL IMAGE ICON
       ========================================================= */

    .image-icon {
      width: 62px;
      height: 62px;

      margin: auto;

      display: block;

      object-fit: contain;

      flex-shrink: 0;
    }




    /* =========================================================
       VIDEO PLAYER
       ========================================================= */

    .video-modal {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: none;

      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, .86);
    }

    .video-modal.open {
      display: flex;
    }

    .video-shell {
      position: relative;

      width: min(90vw, 1100px);

      background: #000;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, .65);
    }

    video {
      display: block;

      width: 100%;
      max-height: 82vh;

      background: #000;
    }

    .close-video {
      position: absolute;

      right: 10px;
      top: 10px;

      z-index: 2;

      width: 42px;
      height: 42px;

      border: 0;
      border-radius: 50%;

      background: rgba(0, 0, 0, .7);

      color: var(--text);

      font-size: 28px;

      cursor: pointer;
    }


    /* =========================================================
       GAMEPAD STATUS
       ========================================================= */

    #gamepadStatus {
      position: fixed;
display: none;
      right: 14px;
      bottom: 10px;

      color: rgba(238, 238, 238, .38);

      font-size: 11px;

      pointer-events: none;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

@media (max-width: 600px) {

  .tile {
    width: 135px;
    height: 120px;
  }

  .image-tile-button {
    width: 216px;
    height: 121.5px;
  }

  .tile-title,
  .row-title,
  .app-title {
    font-size: 18px;
  }

}

span.tile-title {
    padding-top: 9px;
    font-size: 1.4em;
    font-family: 'Roboto Condensed', Arial, sans-serif;
}.tile .imagetile {
    height: 132px;
    width: 235px;
}

button.imagetile.tile {width: 1px;}

.material-symbols-rounded {
    padding-top: 14px;
}
  </style>


  <!-- Material Icons -->

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Icons"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Condensed"
    rel="stylesheet"
  >

</head>


<body>

  <main id="app" tabindex="0">

    <div id="rows"></div>

  </main>


  <!-- VIDEO MODAL -->

  <div
    id="videoModal"
    class="video-modal"
    aria-hidden="true"
  >

    <div class="video-shell">

      <button
        id="closeVideo"
        class="close-video"
        type="button"
        aria-label="Close video"
      >
        ×
      </button>

      <video
        id="player"
        controls
        playsinline
      ></video>

    </div>

  </div>


  <div id="gamepadStatus">
    Keyboard / Gamepad ready
  </div>


<script>

/* ============================================================
   TV APP DATA
   ============================================================ */

let rows = [];

window.addEventListener("load", async () => {
    setBg("image", "https://file.garden/aUYIWVAKvQxCBY-_/database/images/752ad3bd.png");

    addRow("Popular on YouTube");
    let response = await fetch("https://inv.truehosting.net/api/v1/popular");
    if (response.ok) {
        let data = await response.json();

        for (let b of data.slice(0, 5)) {
            addTile(
                rows[0].tiles,
                b.title,
                "",
                "page",
                "https://youtu.be/" + b.videoId,
                "",
                "",
                b.videoThumbnails[0].url,
                "16:9"
            );
        }
    }

    // Home / Onfleek
    

    let onfleekresponse = await fetch("/api/onfleek.json");

    if (onfleekresponse.ok) {
(function(){addRow("Home");})();
        let onfleekdata = await onfleekresponse.json();

        setTimeout((function(){
for (let b of onfleekdata) {
            addTile(
                rows[1].tiles,
                b.title,
                "",
                "page",
                b.siteurl,
                "",
                "",
                b.imgurl,
                "16:9"
            );
        }
}),1000)
    }
});
</script>
<script src="https://thedust.pages.dev/droidavision/app.js"></script>
</body>
</html>
