<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width,initial-scale=1">

  <title>HaloHash</title>

  <style>
    :root {
      --tile: #4a4f52;
      --text: #eeeeee;
      --bg: #20292e;

      --tile-hover: #565c5f;
      --tile-focus: #646a6d;
      --tile-active: #707679;
    }

    * {
      box-sizing: border-box;
    }

    html,
    body {
      width: 100%;
      height: 100%;
      margin: 0;
      overflow: hidden;
    }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: Arial, Helvetica, sans-serif;
      user-select: none;

      background-position: center;
      background-repeat: no-repeat;
      background-size: cover;
    }

    #app {
      width: 100%;
      height: 100%;

      padding: 5.8vh 4.3vw;

      overflow-y: auto;

      outline: none;

      background: transparent;
    }

    .app-title {
      margin: 0 0 10px;

      font-size: 20px;
      font-weight: 400;
    }

    .row {
      margin-bottom: 28px;
    }

    .row-title {
      margin: 0 0 10px;

      font-size: 20px;
      font-weight: 400;
    }

    .tiles {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
    }


    /* =========================================================
       TV TILE
       ========================================================= */

.tile {
  width: 144px;
  height: 126px;

  border: 0;
  border-radius: 1px;

  background: var(--tile);
  color: var(--text);

  box-shadow: 0 4px 9px rgba(0, 0, 0, .28);

  padding: 0;

  display: flex;
  flex-direction: column;
  align-items: stretch;
  justify-content: flex-start;

  overflow: hidden;

  cursor: pointer;

  transition:
    background .12s ease,
    transform .12s ease,
    box-shadow .12s ease;
}

    .tile:hover {
      background: var(--tile-hover);
    }

    .tile.selected {
      background: var(--tile-focus);

      transform: scale(1.025);

      box-shadow:
        0 5px 14px rgba(0, 0, 0, .42);
    }

    .tile:active {
      background: var(--tile-active);

      transform: scale(.985);
    }

.image-tile-button {
  width: 226px;
  height: 127px;

  padding: 0;

  display: block;

  overflow: hidden;
}

.image-tile-button .imagetile {
  display: block;

  width: 100%;
  height: 100%;

  aspect-ratio: 16 / 9;

  object-fit: cover;
}

    /* =========================================================
       MATERIAL SYMBOL ICON
       ========================================================= */

    .tile-icon {
      width: 100%;
      height: 88px;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 7em !important;
      line-height: 1;
      flex-shrink: 0;
    }

    .material-symbols-rounded {
      font-family: "Material Icons";

      font-weight: normal;
      font-style: normal;

      font-size: 52px;
      line-height: 1;

      letter-spacing: normal;
      text-transform: none;

      white-space: nowrap;
      word-wrap: normal;

      direction: ltr;

      -webkit-font-feature-settings: "liga";
      -webkit-font-smoothing: antialiased;

      font-feature-settings: "liga";
    }


    /* =========================================================
       NORMAL IMAGE ICON
       ========================================================= */

    .image-icon {
      width: 62px;
      height: 62px;

      margin: auto;

      display: block;

      object-fit: contain;

      flex-shrink: 0;
    }




    /* =========================================================
       VIDEO PLAYER
       ========================================================= */

    .video-modal {
      position: fixed;
      inset: 0;

      z-index: 100;

      display: none;

      align-items: center;
      justify-content: center;

      background: rgba(0, 0, 0, .86);
    }

    .video-modal.open {
      display: flex;
    }

    .video-shell {
      position: relative;

      width: min(90vw, 1100px);

      background: #000;

      box-shadow:
        0 10px 40px rgba(0, 0, 0, .65);
    }

    video {
      display: block;

      width: 100%;
      max-height: 82vh;

      background: #000;
    }

    .close-video {
      position: absolute;

      right: 10px;
      top: 10px;

      z-index: 2;

      width: 42px;
      height: 42px;

      border: 0;
      border-radius: 50%;

      background: rgba(0, 0, 0, .7);

      color: var(--text);

      font-size: 28px;

      cursor: pointer;
    }


    /* =========================================================
       GAMEPAD STATUS
       ========================================================= */

    #gamepadStatus {
      position: fixed;
display: none;
      right: 14px;
      bottom: 10px;

      color: rgba(238, 238, 238, .38);

      font-size: 11px;

      pointer-events: none;
    }


    /* =========================================================
       MOBILE
       ========================================================= */

@media (max-width: 600px) {

  .tile {
    width: 135px;
    height: 120px;
  }

  .image-tile-button {
    width: 216px;
    height: 121.5px;
  }

  .tile-title,
  .row-title,
  .app-title {
    font-size: 18px;
  }

}

span.tile-title {
    padding-top: 9px;
    font-size: 1.4em;
    font-family: 'Roboto Condensed', Arial, sans-serif;
}.tile .imagetile {
    height: 132px;
    width: 235px;
}

button.imagetile.tile {width: 1px;}

.material-symbols-rounded {
    padding-top: 14px;
}
  </style>


  <!-- Material Icons -->

  <link
    href="https://fonts.googleapis.com/css2?family=Material+Icons"
    rel="stylesheet"
  >

  <link
    href="https://fonts.googleapis.com/css2?family=Roboto+Condensed"
    rel="stylesheet"
  >

</head>


<body>

  <main id="app" tabindex="0">

    <div id="rows"></div>

  </main>


  <!-- VIDEO MODAL -->

  <div
    id="videoModal"
    class="video-modal"
    aria-hidden="true"
  >

    <div class="video-shell">

      <button
        id="closeVideo"
        class="close-video"
        type="button"
        aria-label="Close video"
      >
        ×
      </button>

      <video
        id="player"
        controls
        playsinline
      ></video>

    </div>

  </div>


  <div id="gamepadStatus">
    Keyboard / Gamepad ready
  </div>


<script>

/* ============================================================
   TV APP DATA
   ============================================================ */

let rows = [];


/* ============================================================
   BACKGROUND
   ============================================================

   Examples:

   setBg("color", "#20292e");

   setBg("image", "background.jpg");

   ============================================================ */

function setBg(type, background) {

  if (!background) {
    return;
  }


  /* ----------------------------------------------------------
     COLOR BACKGROUND
     ---------------------------------------------------------- */

  if (type === "color") {

    document.body.style.backgroundImage = "none";

    document.body.style.background =
      background;

    document.documentElement.style
      .setProperty(
        "--bg",
        background
      );

    return;
  }


  /* ----------------------------------------------------------
     IMAGE BACKGROUND
     ---------------------------------------------------------- */

  if (type === "image") {

    document.body.style.background =
      "#000";

    document.body.style.backgroundImage =
      `url("${background}")`;

    document.body.style.backgroundSize =
      "cover";

    document.body.style.backgroundPosition =
      "center";

    document.body.style.backgroundRepeat =
      "no-repeat";

    return;
  }


  console.warn(
    'setBg: type must be "color" or "image"'
  );
}


/* ============================================================
   TILE / ROW HELPERS
   ============================================================ */

function addTile(
  tiles,
  title,
  icon,
  type = "action",
  page = "",
  action = "",
  video = "",
  image = "",
  imageType = ""
) {

  if (!Array.isArray(tiles)) {
    console.warn("addTile: first argument must be a tiles array");
    return;
  }

  tiles.push({
    title,
    icon,
    type,
    page,
    action,
    video,
    image,
    imageType
  });

  render();
}


function addRow(title) {

  rows.push({

    title: title,

    tiles: []

  });


  render();


  return rows.length - 1;
}


/* ============================================================
   APP STATE
   ============================================================ */

const app =
  document.getElementById("app");

const rowsElement =
  document.getElementById("rows");

const videoModal =
  document.getElementById("videoModal");

const player =
  document.getElementById("player");

const closeVideo =
  document.getElementById("closeVideo");

const gamepadStatus =
  document.getElementById("gamepadStatus");


let selectedRow = 0;

let selectedCol = 0;

let gamepadIndex = null;


let lastGamepadState = {

  up: false,

  down: false,

  left: false,

  right: false,

  select: false,

  back: false

};


/* ============================================================
   RENDER
   ============================================================ */

function render() {

  rowsElement.innerHTML = "";


  rows.forEach((row, rowIndex) => {

    const rowElement =
      document.createElement("section");

    rowElement.className = "row";

    rowElement.dataset.row =
      rowIndex;


    const heading =
      document.createElement("h2");

    heading.className =
      "row-title";

    heading.textContent =
      row.title || "";


    const tilesElement =
      document.createElement("div");

    tilesElement.className =
      "tiles";


    (row.tiles || []).forEach(
      (tile, colIndex) => {

        const button =
          document.createElement("button");

        button.type = "button";

        button.className = "tile";

        button.dataset.row =
          rowIndex;

        button.dataset.col =
          colIndex;


        /* ----------------------------------------------------
           IMAGE
           ---------------------------------------------------- */

        if (tile.image) {

          const image =
            document.createElement("img");


          image.src =
            tile.image;


          image.alt =
            tile.title || "";


          /* --------------------------------------------------
             ANDROID TV 16:9 IMAGE

             The image becomes the entire tile.
             No title is rendered.
             -------------------------------------------------- */

          if (
            tile.imageType === "16:9"
          ) {

            image.className =
              "imagetile";

          }

if (tile.imageType === "16:9") {
  button.classList.add("image-tile-button");
}
          /* --------------------------------------------------
             NORMAL IMAGE ICON
             -------------------------------------------------- */

          else {

            image.className =
              "image-icon";

          }


          button.appendChild(image);

        }


        /* ----------------------------------------------------
           MATERIAL SYMBOL
           ---------------------------------------------------- */

        else {

          const icon =
            document.createElement("span");


          icon.className =
            "tile-icon material-symbols-rounded";


          icon.textContent =
            tile.icon || "apps";


          button.appendChild(icon);

        }


        /* ----------------------------------------------------
           TITLE

           16:9 image tiles intentionally have NO title.

           Normal icons and image icons do.
           ---------------------------------------------------- */

        if (
          tile.imageType !== "16:9"
        ) {

          const title =
            document.createElement("span");


          title.className =
            "tile-title";


          title.textContent =
            tile.title || "";


          button.appendChild(title);

        }


        /* ----------------------------------------------------
           MOUSE / TOUCH SUPPORT
           ---------------------------------------------------- */

        button.addEventListener(
          "click",
          () => {

            selectedRow =
              rowIndex;

            selectedCol =
              colIndex;


            updateSelection(true);


            activateTile(tile);

          }
        );


        tilesElement.appendChild(
          button
        );

      }
    );


    rowElement.appendChild(
      heading
    );

    rowElement.appendChild(
      tilesElement
    );


    rowsElement.appendChild(
      rowElement
    );

  });


  clampSelection();

  updateSelection(false);
}


/* ============================================================
   GET TILE
   ============================================================ */

function getTile(row, col) {

  return (

    rows[row] &&

    rows[row].tiles &&

    rows[row].tiles[col]

  ) || null;
}


/* ============================================================
   CLAMP SELECTION
   ============================================================ */

function clampSelection() {

  if (!rows.length) {

    selectedRow = 0;

    selectedCol = 0;

    return;

  }


  selectedRow =
    Math.max(
      0,

      Math.min(
        selectedRow,

        rows.length - 1
      )
    );


  /* ----------------------------------------------------------
     SKIP EMPTY ROWS
     ---------------------------------------------------------- */

  if (
    !rows[selectedRow].tiles.length
  ) {

    let found = false;


    for (
      let i = 0;
      i < rows.length;
      i++
    ) {

      if (
        rows[i].tiles.length
      ) {

        selectedRow = i;

        found = true;

        break;

      }

    }


    if (!found) {

      selectedCol = 0;

      return;

    }

  }


  const tileCount =
    rows[selectedRow].tiles.length;


  selectedCol =
    Math.max(
      0,

      Math.min(
        selectedCol,

        tileCount - 1
      )
    );

}


/* ============================================================
   UPDATE SELECTION
   ============================================================ */

function updateSelection(
  focus = false
) {

  document
    .querySelectorAll(
      ".tile.selected"
    )
    .forEach(tile => {

      tile.classList.remove(
        "selected"
      );

    });


  const tile =
    document.querySelector(
      `.tile[data-row="${selectedRow}"][data-col="${selectedCol}"]`
    );


  if (!tile) {
    return;
  }


  tile.classList.add(
    "selected"
  );


  if (focus) {

    tile.focus({
      preventScroll: true
    });

  }


  tile.scrollIntoView({

    behavior: "smooth",

    block: "nearest",

    inline: "nearest"

  });

}


/* ============================================================
   D-PAD NAVIGATION
   ============================================================ */

function move(direction) {

  if (!rows.length) {
    return;
  }


  /* ----------------------------------------------------------
     LEFT
     ---------------------------------------------------------- */

  if (
    direction === "left"
  ) {

    if (
      selectedCol > 0
    ) {

      selectedCol--;

    }


    updateSelection(true);

    return;

  }


  /* ----------------------------------------------------------
     RIGHT
     ---------------------------------------------------------- */

  if (
    direction === "right"
  ) {

    const row =
      rows[selectedRow];


    if (
      row &&

      selectedCol <
      row.tiles.length - 1
    ) {

      selectedCol++;

    }


    updateSelection(true);

    return;

  }


  /* ----------------------------------------------------------
     UP / DOWN
     ---------------------------------------------------------- */

  if (
    direction === "up" ||
    direction === "down"
  ) {

    const increment =
      direction === "up"
        ? -1
        : 1;


    let newRow =
      selectedRow +
      increment;


    /* --------------------------------------------------------
       SKIP EMPTY ROWS
       -------------------------------------------------------- */

    while (

      newRow >= 0 &&

      newRow < rows.length &&

      (
        !rows[newRow].tiles ||

        rows[newRow].tiles.length === 0
      )

    ) {

      newRow += increment;

    }


    if (

      newRow >= 0 &&

      newRow < rows.length

    ) {

      selectedRow =
        newRow;


      selectedCol =
        Math.min(

          selectedCol,

          rows[selectedRow]
            .tiles.length - 1

        );

    }


    updateSelection(true);

  }

}


/* ============================================================
   ACTIVATE SELECTED TILE
   ============================================================ */

function activateSelectedTile() {

  const tile =
    getTile(
      selectedRow,
      selectedCol
    );


  if (tile) {

    activateTile(tile);

  }

}


/* ============================================================
   ACTIVATE TILE
   ============================================================ */

function activateTile(tile) {

  if (!tile) {
    return;
  }

  /* ----------------------------------------------------------
     PAGE TILE
     ---------------------------------------------------------- */

  if (tile.type === "page") {

    if (tile.page) {
      window.location.href = tile.page;
    }

    return;
  }

  /* ----------------------------------------------------------
     SITE TILE
     ---------------------------------------------------------- */

  if (tile.type === "page") {

    if (tile.page) {
      window.location.href = tile.page;
    }

    return;
  }

  /* ----------------------------------------------------------
     VIDEO TILE
     ---------------------------------------------------------- */

  if (tile.type === "video") {

    openVideo(tile.video);

    return;
  }

  /* ----------------------------------------------------------
     ACTION TILE
     ---------------------------------------------------------- */

  if (
    tile.type === "action" &&
    tile.action
  ) {

    try {

      const action =
        Function(
          `"use strict"; return (${tile.action})`
        )();

      action();

    } catch (error) {

      console.error(
        "Tile action failed:",
        error
      );

    }

  }

}


/* ============================================================
   KEYBOARD D-PAD
   ============================================================ */

document.addEventListener(
  "keydown",
  event => {

    const tag =
      document.activeElement?.tagName;


    /* --------------------------------------------------------
       DON'T NAVIGATE WHILE TYPING
       -------------------------------------------------------- */

    if (

      tag === "INPUT" ||

      tag === "TEXTAREA" ||

      tag === "SELECT"

    ) {

      return;

    }


    switch (event.key) {


      case "ArrowUp":

        event.preventDefault();

        move("up");

        break;


      case "ArrowDown":

        event.preventDefault();

        move("down");

        break;


      case "ArrowLeft":

        event.preventDefault();

        move("left");

        break;


      case "ArrowRight":

        event.preventDefault();

        move("right");

        break;


      case "Enter":

      case " ":

        event.preventDefault();

        activateSelectedTile();

        break;


      case "Escape":

      case "Backspace":

        event.preventDefault();

        closeVideoPlayer();

        break;

    }

  }
);


/* ============================================================
   GAMEPAD SUPPORT
   ============================================================ */

window.addEventListener(
  "gamepadconnected",
  event => {

    gamepadIndex =
      event.gamepad.index;


    gamepadStatus.textContent =
      "Gamepad connected";


    updateSelection(true);

  }
);


window.addEventListener(
  "gamepaddisconnected",
  event => {

    if (

      gamepadIndex ===
      event.gamepad.index

    ) {

      gamepadIndex = null;


      gamepadStatus.textContent =
        "Keyboard / Gamepad ready";

    }

  }
);


/* ============================================================
   GAMEPAD BUTTON
   ============================================================ */

function gamepadButtonPressed(
  gamepad,
  index
) {

  return !!(

    gamepad.buttons[index] &&

    gamepad.buttons[index].pressed

  );

}


/* ============================================================
   ANALOG DEAD ZONE
   ============================================================ */

function axisPressed(value) {

  return Math.abs(value) > 0.55;

}


/* ============================================================
   GAMEPAD POLLING
   ============================================================ */

function pollGamepad() {


  /* ----------------------------------------------------------
     FIND FIRST GAMEPAD
     ---------------------------------------------------------- */

  if (
    gamepadIndex === null
  ) {

    const pads =
      navigator.getGamepads
        ? navigator.getGamepads()
        : [];


    for (
      let i = 0;
      i < pads.length;
      i++
    ) {

      if (pads[i]) {

        gamepadIndex = i;


        gamepadStatus.textContent =
          "Gamepad connected";


        break;

      }

    }

  }


  if (
    gamepadIndex !== null
  ) {

    const gamepad =
      navigator.getGamepads()
        [gamepadIndex];


    if (gamepad) {


      /* ------------------------------------------------------
         PHYSICAL D-PAD
         ------------------------------------------------------ */

      const dpadUp =
        gamepadButtonPressed(
          gamepad,
          12
        );


      const dpadDown =
        gamepadButtonPressed(
          gamepad,
          13
        );


      const dpadLeft =
        gamepadButtonPressed(
          gamepad,
          14
        );


      const dpadRight =
        gamepadButtonPressed(
          gamepad,
          15
        );


      /* ------------------------------------------------------
         ANALOG STICK
         ------------------------------------------------------ */

      const stickX =
        gamepad.axes[0] || 0;


      const stickY =
        gamepad.axes[1] || 0;


      const up =
        dpadUp ||
        stickY < -0.55;


      const down =
        dpadDown ||
        stickY > 0.55;


      const left =
        dpadLeft ||
        stickX < -0.55;


      const right =
        dpadRight ||
        stickX > 0.55;


      /* ------------------------------------------------------
         A / CROSS
         ------------------------------------------------------ */

      const select =
        gamepadButtonPressed(
          gamepad,
          0
        );


      /* ------------------------------------------------------
         B / CIRCLE
         ------------------------------------------------------ */

      const back =
        gamepadButtonPressed(
          gamepad,
          1
        );


      /* ------------------------------------------------------
         EDGE DETECTION
         ------------------------------------------------------ */

      if (
        up &&
        !lastGamepadState.up
      ) {

        move("up");

      }


      if (
        down &&
        !lastGamepadState.down
      ) {

        move("down");

      }


      if (
        left &&
        !lastGamepadState.left
      ) {

        move("left");

      }


      if (
        right &&
        !lastGamepadState.right
      ) {

        move("right");

      }


      if (

        select &&

        !lastGamepadState.select

      ) {

        activateSelectedTile();

      }


      if (

        back &&

        !lastGamepadState.back

      ) {

        closeVideoPlayer();

      }


      lastGamepadState = {

        up,

        down,

        left,

        right,

        select,

        back

      };

    }

  }


  requestAnimationFrame(
    pollGamepad
  );

}


/* ============================================================
   VIDEO
   ============================================================ */

function openVideo(url) {

  if (!url) {
    return;
  }


  player.src = url;


  videoModal.classList.add(
    "open"
  );


  videoModal.setAttribute(
    "aria-hidden",
    "false"
  );


  player.play().catch(
    () => {}
  );

}


/* ============================================================
   CLOSE VIDEO
   ============================================================ */

function closeVideoPlayer() {

  if (

    !videoModal.classList.contains(
      "open"
    )

  ) {

    return;

  }


  player.pause();


  player.removeAttribute(
    "src"
  );


  player.load();


  videoModal.classList.remove(
    "open"
  );


  videoModal.setAttribute(
    "aria-hidden",
    "true"
  );


  updateSelection(true);

}


/* ============================================================
   CLOSE BUTTON
   ============================================================ */

closeVideo.addEventListener(
  "click",
  closeVideoPlayer
);


/* ============================================================
   CLICK OUTSIDE VIDEO
   ============================================================ */

videoModal.addEventListener(
  "click",
  event => {

    if (
      event.target ===
      videoModal
    ) {

      closeVideoPlayer();

    }

  }
);


/* ============================================================
   INITIALIZE
   ============================================================ */

render();

updateSelection(true);

pollGamepad();


/* ============================================================
   BACKGROUND EXAMPLES

   Uncomment ONE of these:

   setBg("color", "#20292e");

   setBg(
     "image",
     "images/background.jpg"
   );

   ============================================================ */


/* Example:
setBg(
  "image",
  "images/background.jpg"
);
*/
window.addEventListener("load", async () => {
    setBg("image", "https://file.garden/aUYIWVAKvQxCBY-_/database/images/752ad3bd.png");

    addRow("Popular on YouTube");
    let response = await fetch("https://inv.truehosting.net/api/v1/popular");
    if (response.ok) {
        let data = await response.json();

        for (let b of data.slice(0, 5)) {
            addTile(
                rows[0].tiles,
                b.title,
                "",
                "site",
                "",
                "",
                "https://youtu.be/" + b.videoId,
                b.videoThumbnails[0].url,
                "16:9"
            );
        }
    }

    // Home / Onfleek
    

    let onfleekresponse = await fetch("/api/onfleek.json");

    if (onfleekresponse.ok) {
(function(){addRow("Home");})();
        let onfleekdata = await onfleekresponse.json();

        setTimeout((function(){
for (let b of onfleekdata) {
            addTile(
                rows[1].tiles,
                b.title,
                "",
                "site",
                "",
                "",
                b.siteurl,
                b.imgurl,
                "16:9"
            );
        }
}),1000)
    }
});

</script>

</body>
</html>
